
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ADS-B Radar UI</title>
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_tag }}" />
</head>
<body>
  <div id="app">
    {% include "_side.html" %}
    <main class="stage">
      <canvas id="radarCanvas"></canvas>
      <div id="wnWindow" class="atc-window wn-window scope-obst" role="dialog" aria-label="What's new" hidden>
        <div class="wn-head" title="Drag to move; resize from the lower-right corner"><span>WHAT'S NEW · USER GUIDES</span><button id="wnClose" class="wn-close" type="button" title="Close (Esc)">&times;</button></div>
        <div class="wx-tabs"><button type="button" data-wntab="news">WHAT'S NEW</button><button type="button" data-wntab="guides">USER GUIDES</button></div>
        <div id="wnBody" class="wn-body">Loading…</div>
        <div id="wnGuides" class="wn-body" hidden>Loading…</div>
      </div>
      <div id="wxWindow" class="atc-window wx-window scope-obst" role="dialog" aria-label="METAR and TAF" hidden>
        <div class="wn-head wx-head" title="Drag to move; resize from the lower-right corner"><span id="wxTitle">METAR &amp; TAF</span><button id="wxClose" class="wn-close" type="button" title="Close">&times;</button></div>
        <div class="wx-tabs"><button type="button" data-wxtab="wx">METAR &amp; TAF</button><button type="button" data-wxtab="rep">REPORTS <span id="wxRepN"></span><span id="wxRepDot" class="rp-dot" hidden></span></button></div>
        <div id="wxBody" class="wn-body">Loading…</div>
        <div id="wxRep" class="wn-body wx-rep" hidden>
          <div id="wxRepBar" class="rp-bar"></div>
          <div id="wxRepList" class="rp-list"></div>
          <div id="wxRepFoot" class="rp-foot"></div>
        </div>
      </div>
      <div id="trWindow" class="atc-window tr-window scope-obst" role="dialog" aria-label="EFHK traffic" hidden>
        <div class="wn-head tr-head" title="Drag to move; resize from the lower-right corner"><span>EFHK TRAFFIC</span><button id="trClose" class="wn-close" type="button" title="Close">&times;</button></div>
        <div class="tr-bar">
          <span class="tr-seg"><button type="button" data-kind="arr" title="Arrivals">ARR</button><button type="button" data-kind="dep" title="Departures">DEP</button><button type="button" data-kind="both" title="Arrivals and departures">BOTH</button></span>
          <span class="tr-seg"><button type="button" data-hours="1">1h</button><button type="button" data-hours="3">3h</button><button type="button" data-hours="6">6h</button><button type="button" data-hours="12">12h</button><button type="button" data-hours="24">1d</button></span>
          <span class="tr-seg" title="The column after the callsign: the registration or the ICAO24 code"><button type="button" data-idcol="reg">REG</button><button type="button" data-idcol="icao">ICAO24</button></span>
        </div>
        <div id="trCount" class="tr-count"></div>
        <div id="trBody" class="wn-body tr-body">Loading…</div>
      </div>
      <div id="tlWindow" class="atc-window tl-window scope-obst" role="dialog" aria-label="Traffic" hidden>
        <div class="wn-head tl-head" title="Drag to move; resize from the lower-right corner"><span>TRAFFIC</span><span class="tl-hbtns"><button id="copyTrafficBtn" class="wn-close tl-copy" type="button" title="Copy the list as text">Copy</button><button id="tlClose" class="wn-close" type="button" title="Close">&times;</button></span></div>
        <div id="tlCount" class="tl-count"></div>
        <div class="wn-body tl-body">
          <table class="tl-table">
            <thead><tr><th data-sort="label" title="Sort by the callsign">CALLSIGN</th><th data-sort="alt" title="Sort by the level">LVL</th><th>SQK</th><th data-sort="range" class="n" title="Sort by the distance from the centre">NM</th><th>REG</th><th>TYPE</th><th></th></tr></thead>
            <tbody id="trafficList"></tbody>
          </table>
        </div>
      </div>
      <div class="overlayBtns scope-obst">
        <button class="btn" id="btnZoomIn" title="Zoom in (smaller range)">+</button>
        <button class="btn" id="btnZoomOut" title="Zoom out (larger range)">&minus;</button>
        <button class="btn" id="btnHome" title="Back to the default centre (EFHK). Drag the map to move it.">&#8962;</button>
        <button class="btn" id="btnPane" title="Show the left pane" hidden>&raquo;</button>
      </div>
    </main>
  </div>
  <script>
    window.RADAR_CENTER = {lat: {{ '%.6f' % center_lat }}, lon: {{ '%.6f' % center_lon }}};
    window.RADAR_ASSET = "{{ asset_tag }}";
  </script>
  <script src="/static/js/topsky.js?v={{ asset_tag }}"></script>
  <script src="/static/js/radar.js?v={{ asset_tag }}"></script>
  <script src="/static/js/replay.js?v={{ asset_tag }}"></script>
  <script src="/static/js/whatsnew.js?v={{ asset_tag }}"></script>
  <script src="/static/js/atcwin.js?v={{ asset_tag }}"></script>
  <script src="/static/js/reports.js?v={{ asset_tag }}"></script>
  <script src="/static/js/wx.js?v={{ asset_tag }}"></script>
  <script src="/static/js/traffic.js?v={{ asset_tag }}"></script>
  <script src="/static/js/trafficlist.js?v={{ asset_tag }}"></script>
  <script src="/static/js/sidepane.js?v={{ asset_tag }}"></script>
</body>
</html>
